<!DOCTYPE html>
<html lang="pl-PL">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cennik usług</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <link href="icon.png"rel="icon"type="image/x-icon">
  </head>
  <body>
    <h1>Cennik usług</h1>
    <section>
    <article>
      <h2>Basic</h2>
      <p class="cena">49 zł</p>
      <p>Podstawowe funkcje</p>
      <p>Wsparcie e-mail</p>
      <p>1 użytkownik</p>
      <button>Wybierz</button>
    </article>
    <article class="polecany">
      <h3 class="polecany">POLECANY</h3>
      <h2>Standard</h2>
      <p class="cena">99 zł</p>
      <p>Wszystkie funkcje Basic</p>
      <p>Wsparcie priorytetowe</p>
      <p>5 użytkowników</p>
      <button>Wybierz</button>
    </article>
    <article>
      <h2>Premium</h2>
      <p class="cena">149 zł</p>
      <p>Wszystkie funkcje Standard</p>
      <p>Wsparcie 24/7</p>
      <p>Nieograniczona liczba użytkowników</p>
      <button>Wybierz</button>
    </article>
    </section>
  </body>
</html>
